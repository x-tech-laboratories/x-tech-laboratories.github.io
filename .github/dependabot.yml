version: 2
updates:
  # Keeps the org submodule, which holds the logos and icons, on the latest .github commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
  # Keeps X-Libs and Halon on their latest releases, bumped together so the Halon peer of X-Libs matches.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: "@x-tech-laboratories/*"
    groups:
      x-tech:
        patterns: ["@x-tech-laboratories/*"]
