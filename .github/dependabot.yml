version: 2
updates:
  # Keeps the org submodule, which holds the logos and icons, on the latest .github commit.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      # Before the Monday 06:00 UTC rebuild in deploy.yml, which publishes the merged bumps.
      day: monday
      time: '00:00'
    groups:
      # X-Libs and Halon in one pull request, so the Halon peer of X-Libs matches.
      x-tech:
        patterns: ['@x-tech-laboratories/*']
      # Third-party patch and minor updates in one pull request; a major update comes on its own.
      npm:
        patterns: ['*']
        exclude-patterns: ['@x-tech-laboratories/*']
        update-types: [minor, patch]
    ignore:
      # The types follow the Node runtime, 24 in CI and the flakes, so their majors move with it by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    # Our own releases skip the default 3-day cooldown, which X-Libs outpaces several times a day.
    # Revisit once X-Libs stabilizes and releases slow down.
    cooldown:
      exclude: ['@x-tech-laboratories/*']
